name: RG-003 v1.0.5 edit visibility final fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Edit visibility final fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Edit button visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="</button>'+(r.status==='Reviewed'?'':'<button type=\"button\" data-edit=\"'+r.id+'\">Edit</button><button type=\"button\" data-review=\"'+r.id+'\">Mark Reviewed</button>')+'<button type=\"button\" data-del=\"'+r.id+'\">Delete</button>"
          new="</button><button type=\"button\" data-edit=\"'+r.id+'\">Edit</button>"+(r.status==='Reviewed'?'':'<button type=\"button\" data-review=\"'+r.id+'\">Mark Reviewed</button>')+'<button type=\"button\" data-del=\"'+r.id+'\">Delete</button>"
          if old not in s:
              old="</button>'+(r.status==='Reviewed'?'':'<button type=\"button\" data-edit=\"'+esc(r.id)+'\">Edit</button><button type=\"button\" data-review=\"'+esc(r.id)+'\">Mark Reviewed</button>')+'<button type=\"button\" data-del=\"'+esc(r.id)+'\">Delete</button>"
              new="</button><button type=\"button\" data-edit=\"'+esc(r.id)+'\">Edit</button>"+(r.status==='Reviewed'?'':'<button type=\"button\" data-review=\"'+esc(r.id)+'\">Mark Reviewed</button>')+'<button type=\"button\" data-del=\"'+esc(r.id)+'\">Delete</button>"
          if old not in s:
              raise SystemExit('Edit visibility pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/fix-edit-visible-v105.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-edit-visible-v105.yml
          git commit -m 'v1.0.5 Edit visibility final fix'
          git push
