name: RG-003 v1.0.5 edit visibility repair
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'repair Edit visibility') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""+(r.status==='Reviewed'?'':'<button type=\"button\" data-edit=\"'+r.id+'\">Edit</button><button type=\"button\" data-review=\"'+r.id+'\">Mark Reviewed</button>')"""
          new="""+'<button type=\"button\" data-edit=\"'+r.id+'\">Edit</button>'+(r.status==='Reviewed'?'':'<button type=\"button\" data-review=\"'+r.id+'\">Mark Reviewed</button>')"""
          if old not in s:
              raise SystemExit('Expected Edit visibility expression not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/fix-edit-visible-now.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-edit-visible-now.yml
          git commit -m 'repair Edit visibility for Draft records'
          git push
