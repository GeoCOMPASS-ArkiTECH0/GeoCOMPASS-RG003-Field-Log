name: Fix RG-003 v1.0.5 Edit visibility
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'v1.0.5 Edit visibility fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Draft Edit action visibly available
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="<button type=\"button\" data-view=\"'+r.id+'\">View</button>'+(r.status==='Reviewed'?'':'<button type=\"button\" data-edit=\"'+r.id+'\">Edit</button><button type=\"button\" data-review=\"'+r.id+'\">Mark Reviewed</button>')+'<button type=\"button\" data-del=\"'+r.id+'\">Delete</button>'"
          new="<button type=\"button\" data-view=\"'+r.id+'\">View</button><button type=\"button\" data-edit=\"'+r.id+'\">Edit</button>"+(r.status==='Reviewed'?'':'<button type=\"button\" data-review=\"'+r.id+'\">Mark Reviewed</button>')+'<button type=\"button\" data-del=\"'+r.id+'\">Delete</button>'"
          if old not in s:
            # Current source escapes the ID with esc(); patch that exact form too.
            old="<button type=\"button\" data-view=\"'+esc(r.recordId)+'\">View</button>'+(r.status==='Reviewed'?'':'<button type=\"button\" data-edit=\"'+esc(r.id)+'\">Edit</button><button type=\"button\" data-review=\"'+esc(r.id)+'\">Mark Reviewed</button>')+'<button type=\"button\" data-del=\"'+esc(r.id)+'\">Delete</button>'"
            new="<button type=\"button\" data-view=\"'+esc(r.recordId)+'\">View</button><button type=\"button\" data-edit=\"'+esc(r.id)+'\">Edit</button>"+(r.status==='Reviewed'?'':'<button type=\"button\" data-review=\"'+esc(r.id)+'\">Mark Reviewed</button>')+'<button type=\"button\" data-del=\"'+esc(r.id)+'\">Delete</button>'"
          if old not in s:
            raise SystemExit('Edit visibility marker not found')
          s=s.replace(old,new,1)
          old2="box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=read().find(x=>x.id===b.dataset.edit);if(!r||r.status==='Reviewed')return;editId=r.id;fill(r);$('save').textContent='Update Draft';msg(r.recordId+' loaded for editing. Original creation time and provenance will be preserved.');window.scrollTo({top:0,behavior:'smooth'})});"
          new2="box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=read().find(x=>x.id===b.dataset.edit);if(!r)return;if(r.status==='Reviewed'){msg(r.recordId+' is Reviewed and protected from ordinary editing.');return}editId=r.id;fill(r);$('save').textContent='Update Draft';msg(r.recordId+' loaded for editing. Original creation time and provenance will be preserved.');window.scrollTo({top:0,behavior:'smooth'})});"
          if old2 in s: s=s.replace(old2,new2,1)
          s=s.replace('RG-003 Prototype v1.0.5','RG-003 Prototype v1.0.5',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/fix-rg003-v105-edit-visibility.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-rg003-v105-edit-visibility.yml
          git commit -m 'v1.0.5 Edit visibility fix'
          git push
