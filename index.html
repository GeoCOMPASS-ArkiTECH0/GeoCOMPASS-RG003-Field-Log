<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoCOMPASS Field Log — RG-003</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.45}label{display:block;margin-top:14px;font-weight:600}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin-top:6px;font:inherit}textarea{min-height:100px}button{margin-top:18px;padding:10px 16px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}#output{white-space:pre-wrap;border:1px solid #ccc;padding:16px;margin-top:20px;display:none}.note{background:#f5f5f5;padding:12px;margin:12px 0}#status{margin-top:14px;padding:12px;border:1px solid #ccc;display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:150px}</style></head><body><h1>GeoCOMPASS Field Log</h1><p><strong>RG-003 Prototype v0.3</strong> — START → OBSERVE → RECORD → EVIDENCE → EXAMINE → APPLY → PRESERVE</p><div class="note">Record direct observations separately from interpretation. Entered data stays in the browser unless you explicitly share it.</div><form id="log"><div class="grid"><div><label>Date<input id="date" type="date" required></label></div><div><label>Time<input id="time" type="time"></label></div></div><label>General location<input id="location" placeholder="General location only"></label><label>Subject<input id="subject" required></label><label>Conditions<textarea id="conditions"></textarea></label><label>Direct observations<textarea id="observations" required></textarea></label><label>Evidence collected or referenced<textarea id="evidence"></textarea></label><label>Interpretation<textarea id="interpretation"></textarea></label><label>Confidence<select id="confidence"><option>Low</option><option selected>Medium</option><option>High</option></select></label><label>Alternative explanation<textarea id="alternative"></textarea></label><label>Recommended next action<textarea id="next"></textarea></label><div class="actions"><button type="submit">Generate Observation Report</button><button type="button" id="copy">Copy Report</button><button type="button" id="share">Share Report Text</button><button type="button" id="download">Save File</button></div></form><div id="status" role="status"></div><pre id="output"></pre><script>const $=id=>document.getElementById(id);let report='';$('date').valueAsDate=new Date();$('log').addEventListener('submit',e=>{e.preventDefault();report=`GEOCOMPASS FIELD LOG — RG-003\n\nDate: ${$('date').value}\nTime: ${$('time').value}\nGeneral location: ${$('location').value}\nSubject: ${$('subject').value}\n\nCONDITIONS\n${$('conditions').value}\n\nDIRECT OBSERVATIONS\n${$('observations').value}\n\nEVIDENCE\n${$('evidence').value}\n\nINTERPRETATION\n${$('interpretation').value}\n\nCONFIDENCE\n${$('confidence').value}\n\nALTERNATIVE EXPLANATION\n${$('alternative').value}\n\nRECOMMENDED NEXT ACTION\n${$('next').value}\n\nPrototype: RG-003 v0.3\nHuman review required for consequential or external use.`;$('output').textContent=report;$('output').style.display='block';show('Report generated.');});function show(x){$('status').textContent=x;$('status').style.display='block'}function ready(){if(!report){$('log').requestSubmit();return false}return true}$('copy').onclick=async()=>{if(!ready())return;try{await navigator.clipboard.writeText(report);show('Report copied to clipboard.')}catch(e){show('Clipboard blocked. Select the report text and use Copy.')}};$('share').onclick=async()=>{if(!ready())return;try{if(navigator.share)await navigator.share({title:'GeoCOMPASS Field Log — RG-003',text:report});show('Report shared successfully.')}catch(e){show(e.name==='AbortError'?'Share canceled. Report remains on screen.':'Share blocked. Use Copy Report.')}};$('download').onclick=()=>{if(!ready())return;try{const u=URL.createObjectURL(new Blob([report],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='geocompass-field-log.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);show('Save requested.')}catch(e){show('File save blocked. Use Copy or Share.')}};</script></body></html>
