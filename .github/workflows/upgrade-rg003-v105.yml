name: RG-003 v1.0.5 controlled draft edit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, 'RG-003 v1.0.5') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v1.0.5
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('RG-003 Prototype v1.0.4','RG-003 Prototype v1.0.5'),
            ('v1.0.4 adds explicit version provenance and reliable mobile form submission.','v1.0.5 adds controlled editing for Draft records while preserving record identity and provenance.'),
            ("BACKUP='geocompass_rg003_backup_v104'","BACKUP='geocompass_rg003_backup_v105'"),
            ("currentVersion='v1.0.4'","currentVersion='v1.0.5'"),
            ("RG-003-backup-v1.0.4.json","RG-003-backup-v1.0.5.json"),
            ("RG-003-records-v1.0.4.json","RG-003-records-v1.0.5.json"),
            ("RG-003 v1.0.4 loaded.","RG-003 v1.0.5 loaded."),
          ]
          for a,b in reps:
            if a not in s: raise SystemExit('Required marker missing: '+a)
            s=s.replace(a,b)
          s=s.replace("var report='',currentId='',currentCreated='',currentVersion='v1.0.5';","var report='',currentId='',currentCreated='',editId='',currentVersion='v1.0.5';")
          old="<button type=\"button\" data-view=\"'+esc(r.id)+'\">View</button>'+(rev?'':'<button type=\"button\" data-review=\"'+esc(r.id)+'\">Mark Reviewed</button>')+'<button type=\"button\" data-del=\"'+esc(r.id)+'\">Delete</button>"
          new="<button type=\"button\" data-view=\"'+esc(r.id)+'\">View</button>"+("+(rev?'':'<button type=\\\"button\\\" data-edit=\\\"'+esc(r.id)+'\\\">Edit</button><button type=\\\"button\\\" data-review=\\\"'+esc(r.id)+'\\\">Mark Reviewed</button>')+")+'<button type=\"button\" data-del=\"'+esc(r.id)+'\">Delete</button>'"
          # Use a simpler direct replacement because the source is minified.
          if old not in s: raise SystemExit('Render button marker missing')
          s=s.replace(old,new,1)
          marker="Array.from(box.querySelectorAll('[data-review]')).forEach(function(b){"
          insert="Array.from(box.querySelectorAll('[data-edit]')).forEach(function(b){b.onclick=function(){var r=read().find(function(x){return x.id===b.dataset.edit});if(!r||r.status==='Reviewed')return;editId=r.id;currentId=r.recordId;currentCreated=r.createdAt;$('date').value=r.date||'';$('time').value=r.time||'';$('location').value=r.location||'';$('subject').value=r.subject||'';$('conditions').value=r.conditions||'';$('observations').value=r.observations||'';$('evidence').value=r.evidence||'';$('interpretation').value=r.interpretation||'';$('confidence').value=r.confidence||'Medium';$('alternative').value=r.alternative||'';$('next').value=r.next||'';$('log').querySelector('button[type=submit]').textContent='Update Draft';status(r.recordId+' loaded for editing. Original creation/provenance will be preserved.')}});"
          if marker not in s: raise SystemExit('Review marker missing')
          s=s.replace(marker,insert+marker,1)
          start="$('log').onsubmit=function(e){e.preventDefault();var a=read(),now=new Date().toISOString();"
          body="$('log').onsubmit=function(e){e.preventDefault();var a=read(),now=new Date().toISOString();"
          if start not in s: raise SystemExit('Submit marker missing')
          # Replace the whole submit function through the next copy handler.
          st=s.index(start)
          en=s.index("$('copy').onclick=",st)
          fn="$('log').onsubmit=function(e){e.preventDefault();var a=read(),now=new Date().toISOString();if(!$('date').value){status('Please complete the required field: date');$('date').focus();return}if(!$('subject').value.trim()){status('Please complete the required field: subject');$('subject').focus();return}if(!$('observations').value.trim()){status('Please complete the required field: direct observations');$('observations').focus();return}if(editId){var r=a.find(function(x){return x.id===editId});if(!r||r.status==='Reviewed'){status('Only Draft records can be edited.');editId='';return}r.date=$('date').value;r.time=$('time').value;r.location=$('location').value;r.subject=$('subject').value;r.conditions=$('conditions').value;r.observations=$('observations').value;r.evidence=$('evidence').value;r.interpretation=$('interpretation').value;r.confidence=$('confidence').value;r.alternative=$('alternative').value;r.next=$('next').value;currentId=r.recordId;currentCreated=r.createdAt;report=make();r.report=report;r.createdUnder=r.createdUnder||currentVersion;if(write(a)){$('output').textContent=report;$('output').style.display='block';render();status(r.recordId+' updated. Original creation time and provenance preserved.');editId='';$('log').querySelector('button[type=submit]').textContent='Generate & Save Report'}return}currentId=nextId(a);currentCreated=now;report=make();var item={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),recordId:currentId,status:'Draft',createdAt:now,createdUnder:currentVersion,date:$('date').value,time:$('time').value,location:$('location').value,subject:$('subject').value,conditions:$('conditions').value,observations:$('observations').value,evidence:$('evidence').value,interpretation:$('interpretation').value,confidence:$('confidence').value,alternative:$('alternative').value,next:$('next').value,report:report};if(write(a.concat([item]))){$('output').textContent=report;$('output').style.display='block';render();status(item.recordId+' saved locally.')}};"
          s=s[:st]+fn+s[en:]
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/upgrade-rg003-v105.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/upgrade-rg003-v105.yml
          git commit -m 'RG-003 v1.0.5: controlled draft editing'
          git push
